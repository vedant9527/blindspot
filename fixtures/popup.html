<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clinic with late popup</title>
<style>
  body { font: 18px/1.4 system-ui, sans-serif; margin: 0; background: #fff; color: #111; }
  .row { position: absolute; left: 24px; display: flex; gap: 12px; }
  a, button { display: inline-block; padding: 8px 14px; font: inherit; }
  a { color: #0b4f9c; }
  button { background: #f2f2f2; color: #111; border: 1px solid #888; border-radius: 4px; }
  :focus { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  #late-popup {
    position: fixed; left: 320px; top: 180px; width: 420px; padding: 24px;
    background: #fff; border: 2px solid #111; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    z-index: 9999;
  }
</style>
</head>
<body>
<header><nav class="row" style="top: 24px"><a href="#home">Home</a><a href="#doctors">Find a doctor</a><a href="#locations">Locations</a><a href="#billing">Pay a bill</a></nav></header>
<main>
  <div class="row" style="top: 120px"><button type="button">Book appointment</button><button type="button">Request records</button><a href="#telehealth">Telehealth</a></div>
  <div class="row" style="top: 220px"><button type="button">Search</button><a href="#insurance">Insurance</a><a href="#careers">Careers</a></div>
</main>
<footer class="row" style="top: 520px"><a href="#privacy">Privacy</a><a href="#contact">Contact us</a></footer>

<script>
  setTimeout(() => {
    const dlg = document.createElement('div');
    dlg.id = 'late-popup';
    dlg.setAttribute('role', 'dialog');
    dlg.setAttribute('aria-modal', 'true');
    dlg.setAttribute('aria-label', 'Newsletter signup');
    dlg.setAttribute('tabindex', '-1');
    dlg.innerHTML = '<h2>Stay updated</h2><p>Get clinic news by email.</p>' +
      '<button type="button" id="close-popup">Close dialog</button>';
    dlg.querySelector('#close-popup').addEventListener('click', () => dlg.remove());
    document.body.appendChild(dlg);
    dlg.focus();
  }, 1000);
</script>
</body>
</html>
